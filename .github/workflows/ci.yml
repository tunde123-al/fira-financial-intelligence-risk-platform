name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint-typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12", cache: pip, cache-dependency-path: backend/requirements-dev.txt}
      - run: pip install -r backend/requirements-dev.txt
      - name: Lint (ruff)
        working-directory: backend
        run: ruff check app tests
      - name: Type check (mypy)
        working-directory: backend
        run: mypy app
      - uses: actions/setup-node@v4
        with: {node-version: "20"}
      - name: Type check and build (TypeScript, Vite)
        working-directory: frontend
        run: npm ci && npm run typecheck && npm run build

  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12", cache: pip, cache-dependency-path: backend/requirements-dev.txt}
      - run: sudo apt-get update && sudo apt-get install -y tesseract-ocr
      - run: pip install -r backend/requirements-dev.txt
      - name: Unit, agent and end-to-end tests
        working-directory: backend
        run: pytest -q tests/unit tests/agent tests/e2e --cov=app --cov-report=term-missing:skip-covered

  integration-tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgis/postgis:16-3.4
        env: {POSTGRES_DB: fira, POSTGRES_USER: fira, POSTGRES_PASSWORD: ci-password}
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U fira" --health-interval 5s --health-retries 20
      neo4j:
        image: neo4j:5.24-community
        env: {NEO4J_AUTH: neo4j/ci-password-neo4j}
        ports: ["7687:7687"]
      qdrant:
        image: qdrant/qdrant:v1.12.4
        ports: ["6333:6333"]
    env:
      DATABASE_URL: postgresql+psycopg://fira:ci-password@localhost:5432/fira
      NEO4J_URI: bolt://localhost:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: ci-password-neo4j
      QDRANT_URL: http://localhost:6333
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12", cache: pip, cache-dependency-path: backend/requirements-dev.txt}
      - run: pip install -r backend/requirements-dev.txt
      - name: Wait for Neo4j
        run: for i in $(seq 1 60); do (echo > /dev/tcp/localhost/7687) 2>/dev/null && break; sleep 2; done
      - name: Migrations (alembic)
        working-directory: backend
        run: alembic upgrade head
      - name: Integration tests (PostgreSQL, Neo4j, Qdrant, API, MCP, LangGraph parity)
        working-directory: backend
        run: pytest -q tests/integration tests/agent/test_agent.py::LangGraphParityTest

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install "bandit[toml]" pip-audit
      - name: Static security analysis (bandit)
        run: bandit -c backend/pyproject.toml -r backend/app -ll
      - name: Dependency vulnerabilities (pip-audit)
        run: pip-audit -r backend/requirements.txt
      - name: Secret scan (no credentials committed)
        run: |
          # the workflow file is excluded because it contains the patterns themselves
          ! git grep -nE "(sk-ant-|sk-[A-Za-z0-9]{20,}|AKIA[0-9A-Z]{16}|-----BEGIN (RSA|EC|OPENSSH) PRIVATE KEY)" -- . ':!*.md' ':!.github/workflows/ci.yml'

  build:
    needs: [lint-typecheck, unit-tests, integration-tests, security]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -f infrastructure/docker/backend.Dockerfile -t fira-backend:${{ github.sha }} .
      - run: docker build -f infrastructure/docker/frontend.Dockerfile -t fira-frontend:${{ github.sha }} .

  publish:
    # Only after every check passed, only on main. Pushes images to GHCR; deployment
    # to AWS (ECS Fargate) is described in docs/DEPLOYMENT.md.
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    needs: [build]
    runs-on: ubuntu-latest
    permissions: {contents: read, packages: write}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with: {registry: ghcr.io, username: "${{ github.actor }}", password: "${{ secrets.GITHUB_TOKEN }}"}
      - run: |
          owner=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          for svc in backend frontend; do
            docker build -f infrastructure/docker/$svc.Dockerfile -t ghcr.io/$owner/fira-$svc:${{ github.sha }} .
            docker push ghcr.io/$owner/fira-$svc:${{ github.sha }}
          done
