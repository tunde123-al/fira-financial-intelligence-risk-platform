# FIRA local stack: PostgreSQL (+PostGIS), Neo4j, Qdrant, backend API, frontend.
#   cp .env.example .env   # then set the secrets
#   docker compose up --build
# First start generates and loads the synthetic dataset (a few minutes).
name: fira

services:
  postgres:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_DB: fira
      POSTGRES_USER: ${POSTGRES_USER:-fira}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes: [pgdata:/var/lib/postgresql/data]
    ports: ["127.0.0.1:5432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-fira} -d fira"]
      interval: 5s
      retries: 20
    deploy: {resources: {limits: {memory: 1g}}}

  neo4j:
    image: neo4j:5.24-community
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD:?set NEO4J_PASSWORD in .env}
      NEO4J_PASSWORD: ${NEO4J_PASSWORD}
      NEO4J_server_memory_heap_initial__size: 512m
      NEO4J_server_memory_heap_max__size: 512m
      NEO4J_server_memory_pagecache_size: 256m
    volumes: [neo4jdata:/data]
    ports: ["127.0.0.1:7474:7474", "127.0.0.1:7687:7687"]
    healthcheck:
      test: ["CMD-SHELL", "cypher-shell -u neo4j -p \"$$NEO4J_PASSWORD\" 'RETURN 1' >/dev/null || exit 1"]
      interval: 10s
      retries: 30
    deploy: {resources: {limits: {memory: 1500m}}}

  qdrant:
    image: qdrant/qdrant:v1.12.4
    volumes: [qdrantdata:/qdrant/storage]
    ports: ["127.0.0.1:6333:6333"]
    deploy: {resources: {limits: {memory: 512m}}}

  backend:
    build: {context: ., dockerfile: infrastructure/docker/backend.Dockerfile}
    env_file: .env
    environment:
      DATA_BACKEND: postgres
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-fira}:${POSTGRES_PASSWORD}@postgres:5432/fira
      GRAPH_BACKEND: neo4j
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: neo4j
      VECTOR_BACKEND: qdrant
      QDRANT_URL: http://qdrant:6333
    volumes: [firadata:/srv/fira/data]
    depends_on:
      postgres: {condition: service_healthy}
      neo4j: {condition: service_healthy}
      qdrant: {condition: service_started}
    ports: ["127.0.0.1:8000:8000"]
    deploy: {resources: {limits: {memory: 2g}}}

  frontend:
    build: {context: ., dockerfile: infrastructure/docker/frontend.Dockerfile}
    depends_on: [backend]
    ports: ["127.0.0.1:8080:8080"]

volumes:
  pgdata:
  neo4jdata:
  qdrantdata:
  firadata:
