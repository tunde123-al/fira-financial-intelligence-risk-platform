[project]
name = "fira-backend"
version = "1.0.0"
description = "Financial Intelligence & Risk Agent (FIRA) backend"
requires-python = ">=3.11"

[tool.ruff]
line-length = 120
target-version = "py311"
extend-exclude = ["alembic/versions"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "S", "UP"]
ignore = [
  "S101",   # asserts in tests / invariants
  "S311",   # non-crypto RNG is intended for synthetic data
  "S608",   # SQL built only from whitelisted column names (see sql_store.py)
  "B008",   # FastAPI Depends()/Query() defaults
  "E731",   # small lambdas
  "UP017",
  "E501",   # long string literals (policy text, SQL) are clearer unwrapped
  "B905",   # zip(strict=) not required where lengths are equal by construction
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S", "B"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
warn_unused_ignores = false
check_untyped_defs = false

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::UserWarning", "ignore::DeprecationWarning"]

[tool.bandit]
exclude_dirs = ["tests"]
skips = ["B101", "B311", "B608"]
